apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "kotlin-kapt"
apply plugin: "com.google.gms.google-services"

android {
    namespace "com.consistencygridwallpaper"
    compileSdk 36

    defaultConfig {
        applicationId "com.consistencygridwallpaper"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 22
        versionName "1.5.4"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def keystorePropertiesFile = rootProject.file('keystore.properties')
            if (!keystorePropertiesFile.exists()) {
                throw new GradleException("Missing android/keystore.properties. Refusing to create an unsigned or debug-signed release build.")
            }

            def keystoreProperties = new Properties()
            keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            def requiredKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
            def missingKeys = requiredKeys.findAll { key -> !keystoreProperties[key]?.toString()?.trim() }
            if (!missingKeys.isEmpty()) {
                throw new GradleException("Missing release signing properties: ${missingKeys.join(', ')}")
            }

            storeFile = file(keystoreProperties['storeFile'])
            storePassword = keystoreProperties['storePassword']
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.10"
    }

    lint {
        // Run lint on release builds so security issues are caught before publishing
        checkReleaseBuilds = true
        abortOnError = true  // Fail build on lint errors to prevent publishing insecure APKs
        // Security-relevant checks — always enabled
        enable 'HardcodedDebugMode', 'ExportedReceiver', 'WorldReadableFiles', 'WorldWriteableFiles'
        // Non-security warnings that are safe to suppress
        disable 'IconMissingDensityFolder', 'MissingTranslation', 'ObsoleteSdkInt'
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    
    // Splash Screen
    implementation "androidx.core:core-splashscreen:1.0.1"
    
    // Browser & Tabs
    implementation "androidx.browser:browser:1.8.0"
    
    // Background Updates
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    
    // Networking
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Google Sign-In
    implementation "com.google.android.gms:play-services-auth:20.7.0"

    // Firebase
    implementation 'com.google.firebase:firebase-messaging:23.4.0'

    // Storage Security
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Jetpack Compose
    def composeBom = platform("androidx.compose:compose-bom:2024.02.00")
    implementation composeBom
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"
    implementation "androidx.navigation:navigation-compose:2.7.7"

    // Room
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    
    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    
    // Image Loading
    implementation "io.coil-kt:coil-compose:2.6.0"
    
    // Icons
    implementation "androidx.compose.material:material-icons-extended:1.6.3"
    
    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.7.0"

    // Google Play Billing
    implementation "com.android.billingclient:billing:8.0.0"
}
