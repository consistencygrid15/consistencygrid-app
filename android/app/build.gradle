apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.google.gms.google-services"

android {
    namespace "com.consistencygridwallpaper"
    compileSdk 35 // Standardized to 35

    defaultConfig {
        applicationId "com.consistencygridwallpaper"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 8
        versionName "1.0.7"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            } else {
                // Fallback to debug if properties are missing (e.g. CI)
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    
    // Splash Screen
    implementation "androidx.core:core-splashscreen:1.0.1"
    
    // Browser & Tabs
    implementation "androidx.browser:browser:1.8.0"
    
    // Background Updates
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    
    // Networking
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Google Sign-In (Native Android SDK)
    implementation "com.google.android.gms:play-services-auth:20.7.0"

    // Firebase Cloud Messaging (For exact immediate updates)
    implementation 'com.google.firebase:firebase-messaging:23.4.0'

    // Storage Security (EncryptedSharedPreferences)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
}
